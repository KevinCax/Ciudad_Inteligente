# Capa ON-PREMISE (LAN municipal).
#
# Todo lo que esta aqui corre dentro de la red de la Municipalidad: el camino
# critico evento -> alerta no cruza la WAN, de modo que el SLO de 2 segundos no
# depende del enlace a internet.
#
# Kafka corre en modo KRaft, sin Zookeeper: es un componente menos que operar y
# monitorear, lo que importa cuando el equipo de sistemas del cliente es
# pequeno. Zookeeper ademas quedo deprecado en Kafka 3.x y eliminado en 4.0.

name: ciudad-edge

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: ciudad-kafka
    ports:
      - "9092:9092"   # acceso desde el host (simuladores, herramientas)
    environment:
      # --- KRaft: el broker es a la vez controlador ---
      # CLUSTER_ID debe ser un UUID de 16 bytes codificado en base64 sin
      # relleno (22 caracteres). No admite un nombre legible: Kafka lo decodifica
      # y verifica la longitud. Se genera una sola vez y se fija aqui, porque el
      # volumen guarda este identificador y un valor distinto al reiniciar
      # invalida los datos ya escritos.
      #   Generar con: kafka-storage random-uuid
      #   o: python -c "import base64,uuid;print(base64.urlsafe_b64encode(uuid.uuid4().bytes).decode().rstrip('='))"
      CLUSTER_ID: aANZk83GSbazr9uJyH5-Gw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listeners ---
      # INTERNAL lo usan los servicios dentro de la red de Docker;
      # EXTERNAL lo usan los simuladores y herramientas desde el host.
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Escala de laboratorio: un solo broker ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 72
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks: [ciudad_lan]
    restart: unless-stopped

  # Crea los topics una sola vez y termina.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: ciudad-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    # tr -d '\r' evita que los finales de linea de Windows rompan el script.
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /scripts/create-topics.sh | /bin/sh"]
    restart: "no"
    networks: [ciudad_lan]

  redis:
    image: redis:7-alpine
    container_name: ciudad-redis
    ports:
      - "6379:6379"
    # appendonly conserva las ventanas de correlacion si el contenedor se
    # reinicia. Sin esto, un reinicio vacia el estado y se pierden las
    # correlaciones en curso.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ciudad_lan]
    restart: unless-stopped

  # El ingestor no habla con la base de datos: solo valida, deduplica en Redis
  # y publica en Kafka. Todas sus dependencias estan en la LAN, de modo que una
  # caida del enlace a internet no detiene la ingesta de eventos.
  ingestor:
    build:
      context: ../services/ingestor
      dockerfile: Dockerfile
    image: ciudad-inteligente/ingestor:latest
    container_name: ciudad-ingestor
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      SERVER_PORT: 8000
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_EVENTS: events.standardized
      KAFKA_TOPIC_DLQ: events.dlq
      REDIS_ADDR: redis:6379
      DEDUPE_TTL: ${DEDUPE_TTL:-24h}
      PARTITION_KEY_STRATEGY: ${PARTITION_KEY_STRATEGY:-zone}
      API_KEY: ${INGESTOR_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      ENVIRONMENT: ${ENVIRONMENT:-development}
    healthcheck:
      # La imagen es distroless y no trae shell ni curl, asi que el health se
      # comprueba desde fuera con docker inspect o desde el propio binario.
      # Aqui se deja el chequeo a nivel de compose deshabilitado a proposito.
      disable: true
    networks: [ciudad_lan]
    restart: unless-stopped

  correlator:
    build:
      context: ../services/correlator
      dockerfile: Dockerfile
    image: ciudad-inteligente/correlator:latest
    container_name: ciudad-correlator
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Solo cambia el puerto del HOST. Dentro de la red de Docker el
      # correlator sigue escuchando en 8080, de modo que Prometheus y los
      # demas servicios no se enteran de esto.
      #
      # Se publica en 8001 y no en 8080 por dos razones: 8080 es el puerto por
      # defecto de media industria y suele estar ocupado en las maquinas de
      # desarrollo, y asi los cinco microservicios quedan en serie —ingestor
      # 8000, correlator 8001, persister 8002, indexer 8003, jobs 8004.
      - "${CORRELATOR_HOST_PORT:-8001}:8080"
    environment:
      SERVER_PORT: 8080
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_EVENTS: events.standardized
      KAFKA_TOPIC_ALERTS: correlated.alerts
      KAFKA_TOPIC_DLQ: events.dlq
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-correlator}
      KAFKA_CONSUME_FROM_START: ${KAFKA_CONSUME_FROM_START:-false}
      REDIS_ADDR: redis:6379
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatoria}
      CORRELATION_SEEN_TTL: ${CORRELATION_SEEN_TTL:-10m}
      CORRELATION_WINDOW_TTL: ${CORRELATION_WINDOW_TTL:-15m}
      ALERT_SUPPRESS_TTL: ${ALERT_SUPPRESS_TTL:-5m}
      # Ventana indexada por vehiculo, para la regla de persecucion. Es mayor
      # que la de zona porque un coche que huye cruza varias zonas.
      VEHICLE_WINDOW_TTL: ${VEHICLE_WINDOW_TTL:-30m}
      # Techo de CREDIBILIDAD, no limite de velocidad: por encima de esta
      # media entre dos apariciones, el enlace se descarta por imposible. Un
      # salto asi suele ser una placa mal leida o clonada, no un coche rapido.
      RULE_VELOCIDAD_MAXIMA_PLAUSIBLE: ${RULE_VELOCIDAD_MAXIMA_PLAUSIBLE:-70}
      # La MISMA llave que persister e indexer. Aqui no protege ningun dato que
      # el correlator escriba —no escribe placas en ningun sitio— sino que
      # garantiza que el seudonimo con el que indexa la ventana de vehiculo sea
      # identico al archivado en la nube. Si difirieran, una alerta de
      # persecucion no se podria cruzar con el historico del coche.
      PLATE_HMAC_KEY: ${PLATE_HMAC_KEY:-}
      RULE_VERSION: ${RULE_VERSION:-1.0}
      API_TOKEN: ${CORRELATOR_API_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      ENVIRONMENT: ${ENVIRONMENT:-development}
    healthcheck:
      disable: true
    networks: [ciudad_lan]
    restart: unless-stopped

  # El persister se situa sobre la frontera LAN -> nube: consume de Kafka (LAN)
  # y escribe en PostgreSQL (nube), tokenizando la placa antes de que el dato
  # salga del control municipal. Es el unico servicio de esta capa que depende
  # del enlace a internet, y por eso es el unico que puede detenerse sin que la
  # ciudad deje de detectar incidentes.
  persister:
    build:
      context: ../services/persister
      dockerfile: Dockerfile
    image: ciudad-inteligente/persister:latest
    container_name: ciudad-persister
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      SERVER_PORT: 8002
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_EVENTS: events.standardized
      KAFKA_TOPIC_DLQ: events.dlq
      KAFKA_CONSUMER_GROUP: ${PERSISTER_CONSUMER_GROUP:-persister}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatoria}
      BATCH_SIZE: ${BATCH_SIZE:-100}
      BATCH_TIMEOUT: ${BATCH_TIMEOUT:-2s}
      PLATE_HMAC_KEY: ${PLATE_HMAC_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      ENVIRONMENT: ${ENVIRONMENT:-development}
    healthcheck:
      disable: true
    networks: [ciudad_lan]
    restart: unless-stopped

  # El indexer, como el persister, esta sobre la frontera LAN -> nube: consume
  # de Kafka (LAN) y escribe en Elasticsearch (nube), tokenizando la placa
  # antes de que el dato cruce. Consume del broker en lugar de copiar por
  # lotes desde la base, de modo que la busqueda queda al dia en segundos
  # (ADR-009).
  #
  # Usa la MISMA llave HMAC que el persister: si difirieran, el mismo vehiculo
  # tendria seudonimos distintos en PostgreSQL y en Elasticsearch.
  indexer:
    build:
      context: ../services/indexer
      dockerfile: Dockerfile
    image: ciudad-inteligente/indexer:latest
    container_name: ciudad-indexer
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8003:8003"
    environment:
      SERVER_PORT: 8003
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_EVENTS: events.standardized
      KAFKA_TOPIC_ALERTS: correlated.alerts
      KAFKA_TOPIC_DLQ: events.dlq
      KAFKA_CONSUMER_GROUP: ${INDEXER_CONSUMER_GROUP:-indexer}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      BATCH_SIZE: ${BATCH_SIZE:-100}
      BATCH_TIMEOUT: ${BATCH_TIMEOUT:-2s}
      PLATE_HMAC_KEY: ${PLATE_HMAC_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      ENVIRONMENT: ${ENVIRONMENT:-development}
    healthcheck:
      disable: true
    networks: [ciudad_lan]
    restart: unless-stopped

  # Avisa a los organismos de respuesta y deja constancia de a quien se aviso.
  #
  # Consume correlated.alerts y escribe en la tabla notifications. Es un
  # servicio aparte y no un campo de la alerta porque el aviso tiene ciclo de
  # vida propio —se crea, se entrega, falla, se reintenta— mientras que la
  # alerta es un hecho inmutable, y porque una alerta avisa a varios organismos.
  #
  # ATENCION: el canal por defecto es SIMULADO. Registra la decision de
  # despacho y permite demostrar la trazabilidad completa, pero no existe
  # integracion con bomberos, policia ni ambulancias: nadie acude.
  notifier:
    build:
      context: ../services/notifier
      dockerfile: Dockerfile
    image: ciudad-inteligente/notifier:latest
    container_name: ciudad-notifier
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8005:8005"
    environment:
      SERVER_PORT: 8005
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_ALERTS: correlated.alerts
      KAFKA_TOPIC_DLQ: events.dlq
      KAFKA_CONSUMER_GROUP: ${NOTIFIER_CONSUMER_GROUP:-notifier}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatoria}
      NOTIFIER_CANAL: ${NOTIFIER_CANAL:-simulado}
      NOTIFIER_WEBHOOK_URL: ${NOTIFIER_WEBHOOK_URL:-}
      # La matriz de despacho se puede ajustar sin recompilar. Sin valor, rige
      # la de fabrica; el servicio registra en el arranque cual esta aplicando.
      DISPATCH_FIRE: ${DISPATCH_FIRE:-}
      DISPATCH_ACCIDENT: ${DISPATCH_ACCIDENT:-}
      DISPATCH_POSSIBLE_ROBBERY: ${DISPATCH_POSSIBLE_ROBBERY:-}
      DISPATCH_TRAFFIC_SPEED_VIOLATION: ${DISPATCH_TRAFFIC_SPEED_VIOLATION:-}
      DISPATCH_VEHICLE_PURSUIT: ${DISPATCH_VEHICLE_PURSUIT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      ENVIRONMENT: ${ENVIRONMENT:-development}
    healthcheck:
      disable: true
    networks: [ciudad_lan]
    restart: unless-stopped

  # Motor de rutas por calle. Traduce una lista de puntos donde una camara vio
  # un vehiculo en el camino mas probable entre ellos, para dibujarlo sobre el
  # mapa en lugar de unir los puntos con lineas rectas.
  #
  # Vive en la capa de BORDE, no en la nube, por el mismo motivo que el
  # correlator: el ADR-001 sostiene que el sistema no depende del enlace a
  # internet. Un servicio de rutas remoto habria convertido el mapa de
  # incidentes en una pantalla que deja de funcionar cuando se cae la conexion,
  # y ademas habria enviado las coordenadas de cada incidente a un tercero.
  #
  # Los datos del mapa los prepara "./make.sh rutas-preparar" UNA vez. No se
  # hace en el arranque: son 131 MB de descarga y varios minutos de calculo, y
  # meterlos en "up" haria que levantar el sistema para una demostracion
  # dependiera de la red.
  osrm:
    image: osrm/osrm-backend:latest
    container_name: ciudad-osrm
    command: osrm-routed --algorithm mld /data/guatemala-latest.osrm
    volumes:
      - ./osrm-data:/data:ro
    ports:
      # 5001 en el host y no 5000: ese puerto lo ocupan con frecuencia otros
      # programas en Windows. Dentro de la red de Docker sigue siendo 5000, que
      # es por donde lo consulta jobs.
      - "${OSRM_HOST_PORT:-5001}:5000"
    healthcheck:
      disable: true
    networks: [ciudad_lan]
    restart: unless-stopped

  # Tareas periodicas: agregados diarios y retencion del historico.
  # Sustituye a Airflow (ADR-009): duerme casi todo el tiempo y despierta dos
  # veces al dia. El cerrojo en Redis garantiza una ejecucion aunque haya
  # varias instancias o el proceso se reinicie.
  jobs:
    build:
      context: ../services/jobs
      dockerfile: Dockerfile
    image: ciudad-inteligente/jobs:latest
    container_name: ciudad-jobs
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8004:8004"
    environment:
      SERVER_PORT: 8004
      TZ_TAREAS: ${TZ_TAREAS:-America/Guatemala}
      HORA_AGREGADOS: ${HORA_AGREGADOS:-03:00}
      HORA_RETENCION: ${HORA_RETENCION:-03:30}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatoria}
      REDIS_ADDR: redis:6379
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      RETENCION_DIAS_PLACA: ${RETENCION_DIAS_PLACA:-90}
      RETENCION_DIAS_COORDENADAS: ${RETENCION_DIAS_COORDENADAS:-365}
      RETENCION_DIAS_BORRADO: ${RETENCION_DIAS_BORRADO:-730}
      RETENCION_MESES_INDICES: ${RETENCION_MESES_INDICES:-12}
      # Motor de rutas, para el recorrido por calles de las alertas.
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      INTERVALO_RUTAS: ${INTERVALO_RUTAS:-1m}
      RUTAS_HORAS_ATRAS: ${RUTAS_HORAS_ATRAS:-48}
      API_TOKEN: ${JOBS_API_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      ENVIRONMENT: ${ENVIRONMENT:-development}
    healthcheck:
      disable: true
    networks: [ciudad_lan]
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ciudad-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ciudad-lan
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks: [ciudad_lan]
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Observabilidad
  #
  # Prometheus y Grafana viven en la LAN, no en la nube, por dos razones.
  #
  # La primera es de seguridad: raspar metricas exige que el recolector ABRA
  # conexiones hacia cada servicio. Con Prometheus en la nube, eso serian
  # conexiones nube -> LAN, es decir trafico de ENTRADA a la red municipal, que
  # es justo lo que el modelo del ADR-001 excluye. Todo lo que cruza la
  # frontera debe ser de salida.
  #
  # La segunda es de utilidad: si el enlace se cae, la deteccion sigue
  # funcionando (ADR-001) y es precisamente entonces cuando hacen falta las
  # metricas y las alertas. Un recolector al otro lado del enlace se queda
  # ciego en el unico momento en que importa.
  #
  # Grafana los acompana porque consulta a Prometheus, y separarlos reintroduce
  # el mismo trafico de entrada. Sus paneles de PostgreSQL y Elasticsearch si
  # cruzan la frontera, pero como consultas puntuales de salida: durante un
  # corte esos paneles quedan en blanco y los de tiempo real siguen vivos, que
  # es la degradacion correcta.
  # -------------------------------------------------------------------------

  grafana:
    image: grafana/grafana:12.4.1
    container_name: ciudad-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Registro de peticiones: por defecto Grafana solo anota los
      # errores, de modo que al diagnosticar un panel vacio no se ve
      # ninguna consulta y parece que el navegador no pide nada.
      GF_SERVER_ROUTER_LOGGING: "${GF_ROUTER_LOGGING:-false}"
      # datasources.yml interpola estas variables leyendo el entorno del
      # CONTENEDOR, no el .env de compose. Sin pasarlas aqui, Grafana provisiona
      # la fuente de PostgreSQL con usuario y base vacios y el tablero de
      # incidentes llega vacio a la demostracion sin un solo error visible.
      GRAFANA_PG_HOST: ${GRAFANA_PG_HOST:-postgres:5432}
      GRAFANA_PG_DATABASE: ${GRAFANA_PG_DATABASE:-ciudades}
      GRAFANA_PG_USER: ${GRAFANA_PG_USER:-ciudad}
      GRAFANA_PG_PASSWORD: ${GRAFANA_PG_PASSWORD:-ciudad}
      GRAFANA_PG_SSLMODE: ${GRAFANA_PG_SSLMODE:-disable}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [ciudad_lan]
    restart: unless-stopped

  # Prometheus recoge las metricas de los cinco microservicios: es lo que
  # sostiene el SLO.
  #
  # Version fija, no latest. Prometheus 3 cambio la normalizacion de las
  # etiquetas le de los histogramas respecto de la serie 2, y un cambio de
  # imagen silencioso puede dejar sin efecto las reglas del SLO. Para una
  # demostracion evaluada en vivo, que la version sea reproducible importa mas
  # que estar al dia.
  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: ciudad-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus-data:/prometheus
    networks: [ciudad_lan]
    restart: unless-stopped

volumes:
  kafka-data:
  redis-data:
  grafana-data:
  prometheus-data:

networks:
  ciudad_lan:
    name: ciudad_lan
    driver: bridge
