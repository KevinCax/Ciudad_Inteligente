# Datasources provisionados automaticamente.
#
# El uid es explicito a proposito: los tableros de dashboards/ referencian la
# fuente por uid, y si Grafana lo generara al azar en cada instalacion los
# paneles llegarian vacios a la demostracion.
#
# El archivo se versiona en lugar de dejarse como plantilla: si cada quien
# tuviera que configurarlo a mano, los tableros llegarian vacios a la
# demostracion. Las credenciales se inyectan por variable de entorno.
apiVersion: 1

datasources:
  - name: PostgreSQL-Ciudades
    uid: postgres-ciudad
    type: postgres
    access: proxy
    url: ${GRAFANA_PG_HOST}
    database: ${GRAFANA_PG_DATABASE}
    user: ${GRAFANA_PG_USER}
    secureJsonData:
      password: ${GRAFANA_PG_PASSWORD}
    jsonData:
      sslmode: ${GRAFANA_PG_SSLMODE}
      postgresVersion: 1600
      timescaledb: false
    isDefault: true

  - name: Prometheus-Ciudades
    uid: prometheus-ciudad
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 10s

  - name: Elasticsearch-Ciudades
    uid: elasticsearch-ciudad
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "events-*"
    jsonData:
      timeField: timestamp
      esVersion: "8.0.0"
