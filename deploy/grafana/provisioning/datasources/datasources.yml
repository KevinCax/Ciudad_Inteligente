# Datasources provisionados automaticamente.
#
# El uid es explicito a proposito: los tableros de dashboards/ referencian la
# fuente por uid, y si Grafana lo generara al azar en cada instalacion los
# paneles llegarian vacios a la demostracion.
#
# El archivo se versiona en lugar de dejarse como plantilla: si cada quien
# tuviera que configurarlo a mano, los tableros llegarian vacios a la
# demostracion. Las credenciales se inyectan por variable de entorno.
apiVersion: 1

datasources:
  - name: PostgreSQL-Ciudades
    uid: postgres-ciudad
    type: postgres
    access: proxy
    url: ${GRAFANA_PG_HOST}
    database: ${GRAFANA_PG_DATABASE}
    user: ${GRAFANA_PG_USER}
    secureJsonData:
      password: ${GRAFANA_PG_PASSWORD}
    jsonData:
      # La base de datos va AQUI, no en el nivel superior. Grafana 11 movio
      # este campo a jsonData: el backend todavia acepta el sitio antiguo, de
      # modo que las consultas por API funcionan, pero el plugin del navegador
      # solo mira jsonData.database y, si lo ve vacio, se niega a enviar la
      # consulta. El tablero queda en "No data" sin una sola peticion HTTP ni
      # un solo error en el log del servidor.
      database: ${GRAFANA_PG_DATABASE}
      sslmode: ${GRAFANA_PG_SSLMODE}
      postgresVersion: 1600
      timescaledb: false
    isDefault: true

  - name: Prometheus-Ciudades
    uid: prometheus-ciudad
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 10s

  - name: Elasticsearch-Ciudades
    uid: elasticsearch-ciudad
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    jsonData:
      # Mismo caso que en Postgres: el indice se mudo de "database" a
      # jsonData.index.
      index: "events-*"
      timeField: timestamp
      esVersion: "8.0.0"
